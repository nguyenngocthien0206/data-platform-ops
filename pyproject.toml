[project]
name = "platform-ops"
version = "1.0.0"
description = "Local-first toolkit for operating a multi-team data platform: cost, incidents, reconciliation"
# No readme key on purpose: the root README.md is a Phase 5 deliverable and must
# contain real numbers from an actual `make demo` run, so it is not stubbed here.
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }

dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "duckdb>=1.0",
    "dbt-duckdb>=1.8",
    "sqlglot>=25.0",
    "networkx>=3.3",
    "pyiceberg[sql-sqlite]>=0.7",
    "psycopg[binary]>=3.1",
    "streamlit>=1.36",
    # Streamlit needs both; PyIceberg and the reconciliation need pyarrow. The
    # Phase 5 caps (<3 and <22, for Windows Smart App Control) were lifted in
    # Phase 7 after the container and native runs matched on the newer releases.
    "pandas>=2.2",
    "pyarrow>=18",
]

[project.scripts]
platform-ops = "platform_ops.cli:main"

[project.optional-dependencies]
# Only for the optional SQL Server legacy source (`docker compose --profile
# sqlserver`). pymssql ships its own TDS driver, so nothing else is installed on
# the host, unlike pyodbc, which needs Microsoft's ODBC driver.
sqlserver = ["pymssql>=2.3"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    # The compiled wheels. Until Phase 8 mypy was capped below 1.20 and built
    # from source, because Windows Smart App Control refused its native modules
    # on the development laptop; that policy is off, and the pure-Python build
    # made a cold type check take minutes.
    "mypy>=2.3",
    "types-PyYAML>=6.0",
    "types-networkx>=3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_ops"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# Beyond the basics: bugbear, simplifications, ruff's own checks (including
# suppression comments that do nothing), performance, return style,
# comprehensions and pathlib. Enabled in Phase 6 so the cleanup does not erode.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PERF", "PIE", "RET", "C4", "PTH"]

[tool.mypy]
python_version = "3.11"
files = ["src/platform_ops"]
strict = true
warn_unreachable = true

# Third-party packages that ship no type information. Kept as a narrow list on
# purpose: anything not named here must type check properly.
[[tool.mypy.overrides]]
module = ["duckdb.*", "pyiceberg.*", "pyarrow", "pyarrow.*", "pymssql", "pandas", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: runs real dbt against a temp warehouse (seconds, not milliseconds)",
]
