[project]
name = "platform-ops"
version = "0.1.0"
description = "Local-first toolkit for operating a multi-team data platform: cost, incidents, reconciliation"
# No readme key on purpose: the root README.md is a Phase 5 deliverable and must
# contain real numbers from an actual `make demo` run, so it is not stubbed here.
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }

dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "duckdb>=1.0",
    "dbt-duckdb>=1.8",
    "sqlglot>=25.0",
    "networkx>=3.3",
    "pyiceberg[sql-sqlite]>=0.7",
    "psycopg[binary]>=3.1",
    "streamlit>=1.36",
]

[project.scripts]
platform-ops = "platform_ops.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    # Capped below 1.20, which added a native `librt` dependency. Together with
    # the no-binary build below this keeps mypy pure Python, so it still runs on
    # locked-down Windows machines where an Application Control policy refuses to
    # load freshly downloaded, low-reputation native extensions.
    "mypy>=1.10,<1.20",
    "types-PyYAML>=6.0",
    "types-networkx>=3.3",
]

[tool.uv]
# Build mypy from source rather than taking the mypyc-compiled wheel. Costs a few
# seconds on first sync and makes `make lint` work in environments that will not
# load unsigned binaries.
no-binary-package = ["mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_ops"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["src/platform_ops"]
strict = true
warn_unreachable = true

# Third-party packages that ship no type information. Kept as a narrow list on
# purpose: anything not named here must type check properly.
[[tool.mypy.overrides]]
module = ["duckdb.*", "pyiceberg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
