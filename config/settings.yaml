# Single source of truth for run parameters. Loaded and validated by
# platform_ops.common.config. Override the file location with PLATFORM_OPS_CONFIG.

# Fixed seed for every generator in the project. Two runs of `make demo` on a
# clean checkout must produce identical reports, so nothing may draw randomness
# from anywhere else.
seed: 20260923

# Single knob controlling dataset size. 1.0 is the default; the measured time of
# `make demo` at this scale is recorded in docs/PROGRESS.md.
scale_factor: 1.0

paths:
  duckdb: data/warehouse.duckdb
  reports: reports
  dbt_project: dbt
  # Where dbt writes manifest.json and run results. Logs go next to it.
  dbt_target: dbt/target

simulation:
  # Raw history begins here, so marts show about a year of behaviour before the
  # simulated window opens.
  history_start: 2025-01-01T00:00:00
  # All simulated time is anchored here. Weeks of simulated activity are
  # generated in minutes of real time by common.clock.
  start: 2026-01-05T00:00:00
  # 16 weeks (112 days): seven weeks of the company before the migration's
  # parallel run, the six-week parallel run, and three weeks of production on
  # ClickHouse after it (`company`). The cost module's 90-day unused-table
  # check covers a real 90 days of activity.
  weeks: 16
  # Simulated hour of day at which the scheduled dbt run happens.
  daily_run_hour: 2

pricing:
  # Rates are illustrative and taken from public vendor list prices so the cost
  # module produces believable money rather than arbitrary units.
  #
  # scan: BigQuery on-demand analysis, 6.25 USD per TiB scanned.
  #   https://cloud.google.com/bigquery/pricing#analysis_pricing_models
  # compute: Snowflake Standard edition, 2.00 USD per credit, one credit per
  #   hour per XS warehouse, 60 second minimum then per-second billing.
  #   https://www.snowflake.com/en/pricing-options/
  scan:
    usd_per_tib: 6.25
    # BigQuery bills at least 10 MB for every table a query references, which
    # is why frequent refreshes of tiny tables still cost money.
    #   https://cloud.google.com/bigquery/pricing#on_demand_pricing
    minimum_billed_bytes_per_table: 10485760
  compute:
    usd_per_credit: 2.00
    credits_per_hour: 1.0
    minimum_billed_seconds: 60
    # Warehouse stays warm this long after a query before it suspends. Idle time
    # inside this window is still billed, which is what makes bursty dashboard
    # traffic more expensive than it looks.
    idle_timeout_seconds: 300
    # One extra-small warehouse per workload, so idle time is charged to the
    # workload that caused it.
    warehouses:
      dbt: transform_wh
      ingestion: transform_wh
      maintenance: transform_wh
      reconcile: transform_wh
      dashboard: bi_wh
      adhoc: adhoc_wh

cost:
  # Declared modelling assumptions, not vendor figures, and printed in the cost
  # report. Compute time is modelled as overhead + bytes / throughput, because
  # measured wall-clock time changes on every run (see docs/adr/0004).
  throughput_bytes_per_second: 200000000
  per_query_overhead_ms: 150
  # What the company pays a month (version 2.0), from public on-demand list
  # prices in us-east-1, looked up in October 2026. The sizing is a declared
  # assumption, printed in the report.
  #
  # The self-managed ClickHouse: one m6i.2xlarge (8 vCPU, 32 GiB), $0.384/h or
  # about $280.32/month, with 500 GB of EBS gp3 at $0.08/GB-month.
  #   https://calculator.holori.com/aws/ec2/m6i.2xlarge
  #   https://cloudchipr.com/blog/aws-ebs-pricing
  clickhouse:
    nodes: 1
    instance_usd_per_month: 280.32
    storage_gb: 500
    storage_usd_per_gb_month: 0.08
  # What the migration replaces: the legacy Postgres stays as the company's
  # operational database, but its reporting runs on a read replica, an RDS for
  # PostgreSQL db.m6i.2xlarge ($520/month, compute only) with 500 GB of RDS gp3
  # ($0.115/GB-month, a single source), decommissioned at cutover.
  #   https://www.bytebase.com/dbcost/rds/instance/db.m6i.2xlarge.md
  #   https://www.usage.ai/blogs/aws/reserved-instances/rds/storage-cost/
  legacy_reporting:
    nodes: 1
    instance_usd_per_month: 520.00
    storage_gb: 500
    storage_usd_per_gb_month: 0.115

recommendations:
  # Unused tables: written in the window but never read, directly or through
  # anything downstream, in the last N days.
  unused_lookback_days: [30, 90]
  # Full-scan hotspots: a large table filtered on the same column again and again.
  hotspot_min_table_bytes: 20000000
  hotspot_min_filtered_reads: 10
  # Incremental candidates: the N models that cost most to build.
  incremental_top_n: 15

workload:
  # dbt runs for real every N simulated days and is replayed from the latest
  # real build on the days in between. A real build takes
  # about 26 s at scale 1.0; every 28 days (4 builds in 13 weeks) was chosen to
  # fit the original 10-minute `make demo` budget, since lifted. Changing it
  # changes the cost report.
  real_build_every_days: 28
  # How often each dashboard refreshes, by exposure maturity.
  dashboard_refresh_hours:
    high: 12
    medium: 24
    low: 24
  # People from config/teams.yaml who query the warehouse by hand.
  adhoc_users: [sam, maya, bruno, olivia, lena]
  adhoc_max_queries_per_day: 3
  # Rows a SQL editor shows before the user stops reading. Queries are logged
  # as written; only the fetch is capped.
  adhoc_result_page_rows: 500
  # Sources that change in place during the window, at scale 1.0. Everything
  # else only ever receives new rows.
  product_price_changes_per_day: 6
  customer_profile_changes_per_day: 40

incidents:
  # Faults happen in operation, during the production weeks after the parallel
  # run (company.production_weeks): two on each of these days into production.
  fault_days: [2, 5, 9, 14]
  # Faults happen during the working day; the next 02:00 run is the first
  # chance to catch them.
  fault_hour: 10
  # Severity score = root_tier_multiplier x tier weight of the root dataset
  # + tier-weighted count of downstream models and exposures (ADR 0005).
  severity:
    root_tier_multiplier: 10
    sev1_min_score: 150
    sev2_min_score: 45
  # Simulated response times. Each incident the owner already has open slows
  # them down by load_factor, because people juggling incidents are slower.
  lifecycle:
    ack_minutes: {SEV1: 20, SEV2: 90, SEV3: 480}
    resolve_hours: {SEV1: 6, SEV2: 18, SEV3: 40}
    load_factor: 0.5

reconcile:
  # The parallel run's nightly reconciliation (Phase 12, ADR 0014): the
  # company's operational tables in Postgres against ClickHouse's raw layer,
  # and its legacy reports against the dbt marts. What is compared is declared
  # in config/reconcile.yaml; the timeline is under `company`.
  # Pairs reconciled at once. One night at scale 1.0 took 102 s one at a time
  # and 23 s with six, on the development laptop.
  workers: 6
  # The diff opens a segment of the key's MD5 until it holds about this many rows.
  leaf_width: 256
  # A decimal difference up to this size is classified as rounding.
  rounding_tolerance: 0.01
  # The cutover is recommended after this many consecutive nights with every
  # table and every report within the thresholds below.
  clean_nights_for_cutover: 14
  # Differences kept per night, pair and class as examples in the ops store.
  examples_per_class: 20
  # How values are rendered before hashing (ADR 0006): the legacy engine's
  # policy, then per-column overrides as "name.column": {rtrim, casefold, scale}.
  canonical:
    engines:
      postgres: {rtrim: false, casefold: false}
    columns: {}
  # Sign-off criteria, fixed before the run and stated first in the report.
  thresholds:
    min_row_match_rate: 0.999
    min_column_match_rate: 0.999
    max_discrepancies:
      missing_in_target: 0
      extra_in_target: 0
      # A key that appears more than once on either side: a join that doubles
      # rows in a new report, or a key declared that is not one.
      duplicate_key: 0
      value_mismatch: 0
      timezone_shift: 0
      whitespace: 0
      case_only: 0
      rounding: 100

metadata:
  # How much a downstream consumer counts, by its ownership tier. Used by the
  # lineage helpers and, in Phase 3, by incident severity: breaking one critical
  # dashboard should outweigh breaking several best-effort tables.
  tier_weights:
    critical: 3
    important: 2
    best_effort: 1

company:
  # Version 2.0: the simulated company's reporting runs on a legacy Postgres
  # (schemas below, in the POSTGRES_DB database) and it migrates to ClickHouse.
  # Hosts, ports and passwords come from .env, never from here.
  legacy_schema: app
  reporting_schema: reporting
  # The raw layer the incremental ingestion fills; dbt's databases are named
  # after its layers (staging, intermediate, marts, reference, snapshots).
  raw_database: raw
  # The toolkit's own results, in a separate database on the Postgres server.
  ops_database: platform_ops
  ops_schema: ops
  # Postgres as ClickHouse sees it: postgresql() runs on the ClickHouse server.
  postgres_from_clickhouse: "postgres:5432"
  # Each load re-reads this much before its watermark (late commits), and
  # ReplacingMergeTree keeps the latest version of anything read twice.
  ingest_overlap_minutes: 60
  # dbt builds every N simulated days and on the last day, and every night
  # of the parallel run. Measured, not assumed: see docs/PROGRESS.md.
  build_every_days: 28
  # The migration's parallel run (Phase 12): the 6 weeks before production.
  # Legacy and ClickHouse both run, dbt builds and the migration is reconciled
  # every night. The ingestion runs as the migration team delivered it, with
  # the defects below, until fix_after_nights into the parallel run, when the
  # fixed job ships and backfills raw. One-off faults follow, each repaired the
  # next day, the way a team works through its morning reconciliation report.
  parallel_run_weeks: 6
  fix_after_nights: 7
  # Production on ClickHouse after the parallel run (Phase 14): every night
  # runs source freshness, run, snapshot and test as separate dbt invocations,
  # faults happen in operation (incidents.fault_days), and the incident desk
  # ingests what dbt reports. A failing check is recorded, not fatal.
  production_weeks: 3
  delivered_job:
    timezone_table: payments
    timezone_column: created_at
    timezone: America/New_York
    float_table: payments
    float_column: amount
    trim_table: customers
    trim_column: email
    batch_table: web_sessions
    batch_rows: 25000
