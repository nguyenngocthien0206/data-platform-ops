# Single source of truth for run parameters. Loaded and validated by
# platform_ops.common.config. Override the file location with PLATFORM_OPS_CONFIG.

# Fixed seed for every generator in the project. Two runs of `make demo` on a
# clean checkout must produce identical reports, so nothing may draw randomness
# from anywhere else.
seed: 20260923

# Single knob controlling dataset size. 1.0 is the default and must keep
# `make demo` under 10 minutes on a 16 GB laptop.
scale_factor: 1.0

paths:
  duckdb: data/warehouse.duckdb
  reports: reports
  iceberg_warehouse: warehouse
  dbt_project: dbt
  # Where dbt writes manifest.json and run results. Logs go next to it.
  dbt_target: dbt/target

simulation:
  # Raw history begins here, so marts show about a year of behaviour before the
  # simulated window opens.
  history_start: 2025-01-01T00:00:00
  # All simulated time is anchored here. Weeks of simulated activity are
  # generated in minutes of real time by common.clock.
  start: 2026-01-05T00:00:00
  # 13 weeks (91 days) rather than the SPEC's default of 6, so the cost
  # module's 90-day unused-table check covers a real 90 days of activity.
  weeks: 13
  # Simulated hour of day at which the scheduled dbt run happens.
  daily_run_hour: 2

pricing:
  # Rates are illustrative and taken from public vendor list prices so the cost
  # module produces believable money rather than arbitrary units.
  #
  # scan: BigQuery on-demand analysis, 6.25 USD per TiB scanned.
  #   https://cloud.google.com/bigquery/pricing#analysis_pricing_models
  # compute: Snowflake Standard edition, 2.00 USD per credit, one credit per
  #   hour per XS warehouse, 60 second minimum then per-second billing.
  #   https://www.snowflake.com/en/pricing-options/
  scan:
    usd_per_tib: 6.25
    # BigQuery bills at least 10 MB for every table a query references, which
    # is why frequent refreshes of tiny tables still cost money.
    #   https://cloud.google.com/bigquery/pricing#on_demand_pricing
    minimum_billed_bytes_per_table: 10485760
  compute:
    usd_per_credit: 2.00
    credits_per_hour: 1.0
    minimum_billed_seconds: 60
    # Warehouse stays warm this long after a query before it suspends. Idle time
    # inside this window is still billed, which is what makes bursty dashboard
    # traffic more expensive than it looks.
    idle_timeout_seconds: 300
    # One extra-small warehouse per workload, so idle time is charged to the
    # workload that caused it.
    warehouses:
      dbt: transform_wh
      dashboard: bi_wh
      adhoc: adhoc_wh

cost:
  # Declared modelling assumptions, not vendor figures, and printed in the cost
  # report. Compute time is modelled as overhead + bytes / throughput, because
  # measured wall-clock time changes on every run (see docs/adr/0005).
  throughput_bytes_per_second: 200000000
  per_query_overhead_ms: 150

recommendations:
  # Unused tables: written in the window but never read, directly or through
  # anything downstream, in the last N days.
  unused_lookback_days: [30, 90]
  # Full-scan hotspots: a large table filtered on the same column again and again.
  hotspot_min_table_bytes: 20000000
  hotspot_min_filtered_reads: 10
  # Incremental candidates: the N models that cost most to build.
  incremental_top_n: 15

workload:
  # dbt runs for real every N simulated days and is replayed from the latest
  # real build on the days in between (see docs/adr/0007). A real build takes
  # about 26 s at scale 1.0, so every 28 days (4 builds in 13 weeks) keeps
  # `make simulate` inside the 10-minute `make demo` budget.
  real_build_every_days: 28
  # How often each dashboard refreshes, by exposure maturity.
  dashboard_refresh_hours:
    high: 12
    medium: 24
    low: 24
  # People from config/teams.yaml who query the warehouse by hand.
  adhoc_users: [sam, maya, bruno, olivia, lena]
  adhoc_max_queries_per_day: 3
  # Rows a SQL editor shows before the user stops reading. Queries are logged
  # as written; only the fetch is capped.
  adhoc_result_page_rows: 500
  # Sources that change in place during the window, at scale 1.0. Everything
  # else only ever receives new rows.
  product_price_changes_per_day: 6
  customer_profile_changes_per_day: 40

incidents:
  # Length of the incident scenario, from its own fresh seed at simulation.start.
  scenario_days: 21
  # Faults happen during the working day; the next 02:00 run is the first
  # chance to catch them.
  fault_hour: 10
  # Severity score = root_tier_multiplier x tier weight of the root dataset
  # + tier-weighted count of downstream models and exposures (ADR 0008).
  severity:
    root_tier_multiplier: 10
    sev1_min_score: 150
    sev2_min_score: 45
  # Simulated response times. Each incident the owner already has open slows
  # them down by load_factor, because people juggling incidents are slower.
  lifecycle:
    ack_minutes: {SEV1: 20, SEV2: 90, SEV3: 480}
    resolve_hours: {SEV1: 6, SEV2: 18, SEV3: 40}
    load_factor: 0.5

reconcile:
  # Legacy engines to reconcile, each against its own Iceberg copy. `sqlserver`
  # needs `docker compose --profile sqlserver up -d` and `uv sync --extra
  # sqlserver`; `platform-ops reconcile run --engine ...` picks engines for one run.
  engines: [postgres]
  # Legacy rows at scale_factor 1.0. The legacy system holds calendar year
  # legacy_year, so its local timestamps cross both DST changes.
  rows: {customers: 50000, orders: 300000, payments: 300000}
  legacy_year: 2025
  # The legacy system stores local wall-clock time in this zone. SQL Server
  # names zones the Windows way, so it gets its own spelling.
  legacy_timezone: America/New_York
  legacy_timezone_windows: Eastern Standard Time
  # Segmented diff: each differing segment splits into `fanout` children until
  # a segment spans at most `leaf_width` keys; only then are rows fetched.
  fanout: 16
  leaf_width: 256
  # A decimal difference up to this size is classified as rounding.
  rounding_tolerance: 0.01
  # How values are rendered before hashing (ADR 0009). Engine defaults first,
  # then per-column overrides as "table.column": {rtrim, casefold, scale}.
  # SQL Server folds case to model its case-insensitive default collation.
  canonical:
    engines:
      postgres: {rtrim: false, casefold: false}
      sqlserver: {rtrim: false, casefold: true}
      duckdb: {rtrim: false, casefold: false}
    columns: {}
  # Sign-off criteria, fixed before the run and stated first in the report.
  thresholds:
    min_row_match_rate: 0.999
    min_column_match_rate: 0.999
    max_discrepancies:
      missing_in_target: 0
      extra_in_target: 0
      value_mismatch: 0
      timezone_shift: 0
      whitespace: 0
      case_only: 0
      rounding: 100

metadata:
  # How much a downstream consumer counts, by its ownership tier. Used by the
  # lineage helpers and, in Phase 3, by incident severity: breaking one critical
  # dashboard should outweigh breaking several best-effort tables.
  tier_weights:
    critical: 3
    important: 2
    best_effort: 1
