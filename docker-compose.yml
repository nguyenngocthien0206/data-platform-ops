# The simulated company (version 2.0) and the toolkit itself in a container.
#
# Postgres holds the company's legacy database and, in a database of its own,
# the toolkit's results (ops). ClickHouse is the warehouse the company migrates
# to. Both always start. The toolkit services sit behind profiles, so a plain
# `docker compose up` starts only the two servers. Use the docker-* make
# targets to run them.

name: data-platform-ops

# Shared by every container that runs the toolkit image. Generated state lives
# on named volumes (fast disk inside the Docker VM, where a bind mount from a
# Windows or macOS host would be slow for DuckDB files); reports/ is bind-mounted
# so the reports show up on the host. Service addresses are the Compose service
# names and container ports; a real environment variable wins over .env.
#
# TOOLKIT_IMAGE runs a published image instead of the local build, for example
# TOOLKIT_IMAGE=ghcr.io/nguyenngocthien0206/data-platform-ops:1.0.0 make docker-demo
x-toolkit: &toolkit
  build: .
  image: ${TOOLKIT_IMAGE:-data-platform-ops:local}
  env_file: .env
  environment:
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    CLICKHOUSE_HOST: clickhouse
    CLICKHOUSE_PORT: "8123"
    METABASE_URL: http://metabase:3000
    # .streamlit/config.toml binds to localhost for the native run; inside the
    # container the dashboards must answer on the published port.
    STREAMLIT_SERVER_ADDRESS: 0.0.0.0
  volumes:
    - app_data:/app/data
    - app_warehouse:/app/warehouse
    - app_dbt_target:/app/dbt/target
    - app_dbt_logs:/app/dbt/logs
    - ./reports:/app/reports
  depends_on:
    postgres:
      condition: service_healthy
    clickhouse:
      condition: service_healthy

services:
  # One-shot runner: `docker compose run --rm app <command>`.
  app:
    <<: *toolkit
    profiles: ["app"]

  dashboard:
    <<: *toolkit
    profiles: ["dashboard", "browser"]
    command: ["platform-ops", "dashboard", "--headless"]
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  # Loads every dashboard page in headless Chromium and saves screenshots to
  # reports/screenshots. Playwright stays in its own image, so the toolkit image
  # and uv.lock carry no browser. The official image ships the browsers but not
  # the Python package, which must match the image's version.
  browser-check:
    build: &playwright
      context: scripts
      dockerfile_inline: |
        FROM mcr.microsoft.com/playwright/python:v1.63.0-noble
        RUN pip install --no-cache-dir --break-system-packages playwright==1.63.0
    image: data-platform-ops-browser-check:local
    pull_policy: build
    profiles: ["browser"]
    working_dir: /work
    command: ["python", "scripts/check_dashboards.py", "--url", "http://dashboard:8501"]
    volumes:
      - ./scripts:/work/scripts:ro
      - ./reports:/work/reports
    depends_on:
      dashboard:
        condition: service_healthy

  # Opens every Metabase dashboard in headless Chromium, fails on a broken card,
  # and saves screenshots to reports/screenshots/metabase. Same image as above.
  metabase-screens:
    build: *playwright
    image: data-platform-ops-browser-check:local
    pull_policy: build
    profiles: ["metabase"]
    env_file: .env
    working_dir: /work
    command: ["python", "scripts/screenshot_metabase.py", "--url", "http://metabase:3000"]
    volumes:
      - ./scripts:/work/scripts:ro
      - ./reports:/work/reports
    depends_on:
      metabase:
        condition: service_healthy

  # Answers like Slack and Telegram and keeps every message, so the orchestrator
  # tests (Phase 14b) can check a page without sending one. The toolkit image
  # already holds the script; it needs neither server.
  chat:
    image: ${TOOLKIT_IMAGE:-data-platform-ops:local}
    profiles: ["chat"]
    command: ["python", "orchestrators/chat_double.py", "--host", "0.0.0.0", "--port", "8099"]
    ports:
      - "${CHAT_DOUBLE_PORT:-8099}:8099"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8099/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  # The company's dbt project scheduled by Airflow 3 through Cosmos (Phase 14b,
  # ADR 0020), as its own company in the af_ namespace, so nothing it does
  # touches `make demo`. Its own image: Airflow's environment and the toolkit's
  # never share packages. The container gets only what it uses, not .env: the
  # Postgres login for its metadata database (`airflow`) and the incident store,
  # and the company's dbt user, not the ClickHouse admin. Pages go to the chat
  # double. `make airflow` seeds the company and starts it.
  airflow:
    build:
      context: .
      dockerfile: orchestrators/airflow/Dockerfile
    image: data-platform-ops-airflow:local
    pull_policy: build
    container_name: dpo-airflow
    profiles: ["airflow"]
    environment:
      # Checked when the container starts (start.py), so the rest of this file
      # still works for anyone who never runs Airflow.
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-platform_ops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-legacy}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: af_dbt
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD_DBT:-}
      PLATFORM_OPS_NAMESPACE: af_
      PLATFORM_OPS_SCALE_FACTOR: ${AIRFLOW_SCALE:-0.1}
      SLACK_BOT_TOKEN: chat-double
      SLACK_API_URL: http://chat:8099
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/api/v2/monitor/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  postgres:
    image: postgres:16
    container_name: dpo-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-platform_ops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-legacy}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-platform_ops} -d ${POSTGRES_DB:-legacy}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # The company's warehouse (version 2.0): the incremental ingestion reads
  # Postgres from here through postgresql(), at postgres:5432, and dbt builds
  # the company's project on it. The defaults match the dbt profile, so an
  # older .env still works.
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.16.41
    container_name: dpo-clickhouse
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-platform_ops}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-change_me_locally}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "${CLICKHOUSE_PORT:-8123}:8123"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  # The company's BI (Phase 11b): one dashboard per dbt exposure, created by
  # `platform-ops metabase provision`, querying ClickHouse as the `metabase`
  # user. Its own state lives in a `metabase` database on the Postgres server,
  # so it needs no volume. Behind a profile because it is a heavy JVM service
  # that `make demo` and `make test` never need: `make metabase` starts it.
  metabase:
    image: metabase/metabase:v0.63.19.6
    container_name: dpo-metabase
    profiles: ["metabase"]
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres
      MB_DB_PORT: "5432"
      MB_DB_DBNAME: metabase
      MB_DB_USER: ${POSTGRES_USER:-platform_ops}
      MB_DB_PASS: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Offline and quiet: no usage statistics, no update checks.
      MB_ANON_TRACKING_ENABLED: "false"
      MB_CHECK_FOR_UPDATES: "false"
      JAVA_OPTS: "-Xmx1g"
    ports:
      - "${METABASE_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

volumes:
  postgres_data:
  clickhouse_data:
  app_data:
  app_warehouse:
  app_dbt_target:
  app_dbt_logs:
