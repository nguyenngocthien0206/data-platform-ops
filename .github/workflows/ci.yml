# Lint, type check, tests and the ownership check, in the toolkit's container.
#
# CI calls the same docker-* make targets people run locally, so CI and a laptop
# cannot drift apart. Postgres and ClickHouse (the pilot's warehouse) come from
# Compose; SQL Server runs in its own on-demand workflow (sqlserver.yml), because
# its image is large and slow to start. The release workflow calls this one
# before it publishes anything.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # Fresh volumes on every run, so the example credentials are the real ones.
      - name: Local settings for Compose
        run: cp .env.example .env

      - uses: docker/setup-buildx-action@v4

      # Loaded under the tag Compose expects, so the make targets do not rebuild.
      - name: Build the toolkit image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: data-platform-ops:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Lint, format and type check
        run: make docker-lint

      # CODEOWNERS for data: every dataset has exactly one owner.
      - name: Ownership check
        run: make docker-metadata-check

      # The SQL Server cases skip here, with their reason listed.
      - name: Tests against Postgres and ClickHouse
        run: make docker-test DOCKER_ENGINES="postgres clickhouse"

      - name: Stop the services
        if: always()
        run: make down
