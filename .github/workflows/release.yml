# Publish a release when a version tag is pushed (the owner pushes it).
#
# The full CI runs first, and so do two checks pull requests skip because they
# are slow: the Metabase check (the demo builds the company, then every
# dashboard is provisioned, every card run through Metabase, and every dashboard
# opened in a browser) and the orchestrator check (a fault through Airflow and
# through Dagster, each opening one incident and resolving it, Phase 14b).
# Then, only if the tag equals the version in
# pyproject.toml and CHANGELOG.md has notes for it, the image goes to GitHub
# Container Registry (amd64, like the SQL Server image) and a GitHub Release is
# created with that version's changelog section as its notes. Nothing is
# published on ordinary pushes.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  orchestrators:
    uses: ./.github/workflows/orchestrators.yml

  metabase:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Local settings for Compose
        run: cp .env.example .env

      - uses: docker/setup-buildx-action@v4

      - name: Build the toolkit image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: data-platform-ops:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # At scale 0.1: the full timeline (the parallel run included) on a
      # runner with a few cores. The release checks behaviour; the numbers are
      # the scale 1.0 runs recorded in docs/PROGRESS.md.
      - name: The company on Postgres and ClickHouse
        run: make docker-demo SCALE=0.1

      - name: Every dashboard in Metabase
        run: make docker-metabase-check

      - name: Dashboard screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: metabase-screenshots
          path: reports/screenshots/metabase/
          if-no-files-found: ignore

      - name: Stop the services
        if: always()
        run: make down

  publish:
    needs: [checks, metabase, orchestrators]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: The tag matches the version and has release notes
        id: version
        shell: bash
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match version ${version} in pyproject.toml"
            exit 1
          fi
          python3 scripts/release_notes.py "${version}" > "${RUNNER_TEMP}/notes.md"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      # 1.0.0, 1.0 and, for a stable version, latest (metadata-action's default).
      # The OCI labels link the package to this repository on GHCR.
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: GitHub Release from the changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          --verify-tag
          --title "data-platform-ops ${{ steps.version.outputs.version }}"
          --notes-file "${RUNNER_TEMP}/notes.md"
